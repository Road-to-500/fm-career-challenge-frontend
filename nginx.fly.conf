server_names_hash_bucket_size 64;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 421;
}

server {
    listen 80;
    listen [::]:80;
    server_name road-to-500-web-prod.fly.dev;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve at request time so backend restarts do not require an Nginx restart.
    resolver [fdaa::3] valid=10s ipv4=off;
    resolver_timeout 5s;
    set $api_backend road-to-500-api-prod.internal:8080;

    location ~ ^/(api(?:/|$)|hubs(?:/|$)|signin-google$) {
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
